# Jenkins infrastructure — SEPARATE from the application docker-compose.yml.
#
# Services:
#   dind     - Docker-in-Docker build service with TLS enabled
#   jenkins  - Jenkins LTS (JDK 21) UI, bound to localhost only
#
# The host Docker socket is NOT mounted. Jenkins talks to the isolated dind
# daemon over TLS using certificates from the shared jenkins-dind-certs volume.
#
# Usage:
#   cd jenkins
#   docker compose up -d --build
#   docker compose exec jenkins cat /var/jenkins_home/secrets/initialAdminPassword
#
# Optional: set JENKINS_HTTP_PORT to use a different local port, e.g.
#   JENKINS_HTTP_PORT=8081 docker compose up -d --build

services:
  # ------------------------------------------------------------
  # Isolated Docker build service (Docker-in-Docker with TLS)
  # ------------------------------------------------------------
  docker:
    image: docker:27-dind
    container_name: jenkins-dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: /certs
    volumes:
      # TLS certificates are generated here and shared read-only with Jenkins
      - jenkins-dind-certs:/certs
      # Docker's own data (images/layers) persists separately from Jenkins
      - jenkins-dind-data:/var/lib/docker
    networks:
      - jenkins-net

  # ------------------------------------------------------------
  # Jenkins controller
  # ------------------------------------------------------------
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jenkins
    ports:
      # Bound ONLY to the local loopback interface — never public
      - "127.0.0.1:${JENKINS_HTTP_PORT:-8080}:8080"
    environment:
      DOCKER_HOST: tcp://docker:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /certs/client
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=true"
    volumes:
      # Jenkins configuration, jobs and credentials persist across restarts
      - jenkins-home:/var/jenkins_home
      # TLS client certificate/key generated by dind
      - jenkins-dind-certs:/certs:ro
    depends_on:
      - docker
    networks:
      - jenkins-net

networks:
  jenkins-net:
    driver: bridge

volumes:
  jenkins-home:
  jenkins-dind-certs:
  jenkins-dind-data:
