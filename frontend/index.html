<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager - Containerized 3-Tier App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Task Manager</h1>
            <p class="subtitle">Frontend (Nginx) &rarr; Backend (FastAPI) &rarr; Database (PostgreSQL)</p>
        </header>

        <section class="card add-task-card">
            <h2>Add a New Task</h2>
            <form id="task-form">
                <input type="text" id="title" placeholder="Task title" required maxlength="200">
                <textarea id="description" placeholder="Description (optional)" maxlength="1000"></textarea>
                <select id="status">
                    <option value="pending">Pending</option>
                    <option value="in_progress">In Progress</option>
                    <option value="completed">Completed</option>
                </select>
                <button type="submit">Create Task</button>
            </form>
            <p id="form-message" class="message"></p>
        </section>

        <section class="card tasks-card">
            <h2>All Tasks</h2>
            <div id="loading">Loading tasks...</div>
            <table id="tasks-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Description</th>
                        <th>Status</th>
                        <th>Completed</th>
                        <th>Created</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="tasks-body"></tbody>
            </table>
            <p id="empty-message" class="empty">No tasks yet. Create one above!</p>
            <p id="error-message" class="message error"></p>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
